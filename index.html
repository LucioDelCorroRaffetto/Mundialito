<!doctype html>
<html lang="es-AR" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- user-scalable=yes + maximum-scale=5 lets older users pinch-zoom
         the page from the browser. The previous user-scalable=no blocked
         that and violated WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mundialito" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Mundialito · El prode + fantasy del Mundial</title>
    <meta name="description" content="El prode + fantasy del Mundial entre amigos. Crea ligas privadas, predice resultados, arma tu equipo fantasy y competí contra tus amigos." />
    <!-- Preconnect to font CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to API so first data fetch starts ASAP -->
    <link rel="preconnect" href="https://mundialito-d2jk.onrender.com" />
    <!--
      Inter (body font) — display=swap: briefly shows fallback, then swaps.
      Oswald/Russo One/Space Grotesk (display fonts) — display=optional: no
      swap, no CLS. If font doesn't arrive within ~100 ms, browser keeps the
      fallback for that page load. Acceptable for decorative headings.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Russo+One&family=Space+Grotesk:wght@400;500;700&display=optional" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
